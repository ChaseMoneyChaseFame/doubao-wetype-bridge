name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect release signing mode
        id: signing
        run: |
          if [[ -n "$DEVELOPER_ID_APPLICATION" \
            && -n "$DEVELOPER_ID_P12_BASE64" \
            && -n "$DEVELOPER_ID_P12_PASSWORD" \
            && -n "$NOTARY_KEY_BASE64" \
            && -n "$NOTARY_KEY_ID" \
            && -n "$NOTARY_ISSUER_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID
        if: steps.signing.outputs.available == 'true'
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$RUNNER_TEMP/release.keychain-db" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db"

      - name: Test
        run: |
          swift run BridgeSelfTests
          swift test

      - name: Build app and DMG
        run: |
          chmod +x Scripts/*.sh
          if [[ "${{ steps.signing.outputs.available }}" == "true" ]]; then
            VERSION="${GITHUB_REF_NAME#v}" \
              BUILD_NUMBER="${{ github.run_number }}" \
              CODE_SIGN_IDENTITY="$DEVELOPER_ID_APPLICATION" \
              Scripts/build-app.sh
          else
            VERSION="${GITHUB_REF_NAME#v}" \
              BUILD_NUMBER="${{ github.run_number }}" \
              Scripts/build-app.sh
          fi
          VERSION="${GITHUB_REF_NAME#v}" Scripts/create-dmg.sh
          if [[ "${{ steps.signing.outputs.available }}" == "true" ]]; then
            codesign --force --timestamp --sign "$DEVELOPER_ID_APPLICATION" \
              ".build/release/DoubaoWeTypeBridge-${GITHUB_REF_NAME#v}-universal.dmg"
          fi

      - name: Notarize
        if: steps.signing.outputs.available == 'true'
        run: |
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" \
            Scripts/notarize.sh ".build/release/DoubaoWeTypeBridge-${GITHUB_REF_NAME#v}-universal.dmg"
          shasum -a 256 ".build/release/DoubaoWeTypeBridge-${GITHUB_REF_NAME#v}-universal.dmg" \
            > ".build/release/DoubaoWeTypeBridge-${GITHUB_REF_NAME#v}-universal.dmg.sha256"

      - name: Prepare release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            if [[ "${{ steps.signing.outputs.available }}" == "true" ]]; then
              echo "此版本已经 Developer ID 签名并通过 Apple 公证。"
            else
              echo "此版本使用 ad-hoc 签名，尚未经过 Apple 公证。首次启动如遇拦截，请在「应用程序」中右键点击「豆微输入法」，选择「打开」。"
            fi
            echo
            awk -v version="$version" '
              $0 ~ "^## " version "([[:space:]]|$)" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ".build/release/DoubaoWeTypeBridge-${GITHUB_REF_NAME#v}-universal.dmg" \
            ".build/release/DoubaoWeTypeBridge-${GITHUB_REF_NAME#v}-universal.dmg.sha256" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "豆微输入法 ${GITHUB_REF_NAME#v}"
